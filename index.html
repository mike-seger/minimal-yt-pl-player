<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Playlist Player</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-header-row">
        <div id="playlist-picker" aria-label="Select playlist">
          <div id="playlist-picker-selected">
            <div id="playlist-title">Loading…</div>
            <div id="track-count"></div>
            <span id="playlist-picker-arrow">&#9660;</span>
          </div>
          <div id="playlist-picker-dropdown" hidden></div>
        </div>
        <button id="btn-settings" title="Settings">&#8942;</button>
      </div>
    </div>
    <div id="track-filter-wrap">
      <input id="track-filter" type="search" placeholder="Filter tracks…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div id="year-filter">
        <button id="year-filter-btn" title="Filter by year">Year</button>
        <div id="year-filter-dropdown" hidden></div>
      </div>
    </div>
    <div id="track-list"></div>

    <div id="settings-overlay" hidden>
      <div class="settings-header">
        <span class="settings-title">Settings</span>
        <button id="settings-close" class="settings-close-btn">&#10005;</button>
      </div>
      <div class="settings-body">

        <section class="settings-section">
          <label class="settings-checkbox-row">
            <input type="checkbox" id="setting-hide-restricted" autocomplete="off">
            <span>Hide restricted tracks</span>
          </label>
        </section>

        <section class="settings-section">
          <div class="settings-section-title">Playlists</div>
          <div id="settings-playlist-list"></div>
          <label class="drop-zone" id="settings-drop-zone">
            <input type="file" id="settings-file-input" accept=".json,.tsv,.csv">
            <span>&#8853; Drop or click to add playlist (JSON / TSV / CSV)</span>
          </label>
        </section>

        <section class="settings-section">
          <div class="settings-section-title">Track scanning</div>
          <div class="settings-scan-row">
            <button class="settings-btn" id="settings-scan-btn">Scan All Tracks</button>
            <button class="settings-btn" id="settings-scan-restricted-btn">Scan Restricted</button>
            <button class="settings-btn" id="settings-clear-restricted-btn">Clear All</button>
          </div>
          <div id="settings-scan-status" class="settings-muted" hidden></div>
        </section>

        <section class="settings-section">
          <div class="settings-section-title">Failed video IDs</div>
          <div id="settings-failed-count" class="settings-muted">No failed videos recorded.</div>
          <div class="settings-scan-row">
            <button class="settings-btn" id="settings-copy-failed">Copy to clipboard</button>
            <button class="settings-btn" id="settings-clear-failed">Clear</button>
          </div>
        </section>

      </div>
    </div>
  </aside>

  <main id="main">
    <div id="player-area">
      <div id="status-overlay">Loading playlist…</div>
      <div id="player-wrap">
        <div id="yt-player"></div>
      </div>
    </div>
    <div id="now-playing-bar">
      <div id="now-playing-title"><span>Now playing:</span>–</div>
      <button class="ctrl-btn" id="btn-prev">&#8592; Prev</button>
      <button class="ctrl-btn" id="btn-next">Next &#8594;</button>
    </div>
  </main>
</div>

<script type="module" src="player.js"></script>
</body>
</html>
